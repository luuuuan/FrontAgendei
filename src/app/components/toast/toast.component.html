<div class="toast-container">
  <div
    *ngFor="let toast of toasts"
    class="toast"
    [class]="'toast toast--' + toast.tipo"
  >
    <i [class]="icone(toast.tipo)"></i>
    <span>{{ toast.mensagem }}</span>
    <button class="toast-close" (click)="remover(toast.id)">×</button>
  </div>
</div>
