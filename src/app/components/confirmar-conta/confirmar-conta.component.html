<div class="confirm-page">
  <div class="confirm-card">
    <div class="confirm-logo">
      <i class="fas fa-calendar-check"></i>
      <span>Agendei</span>
    </div>

    <!-- Carregando -->
    <div *ngIf="estado === 'carregando'" class="confirm-content">
      <div class="confirm-icon carregando">
        <i class="fas fa-spinner fa-spin"></i>
      </div>
      <h2>Confirmando sua conta...</h2>
      <p>Aguarde um momento.</p>
    </div>

    <!-- Sucesso -->
    <div *ngIf="estado === 'sucesso'" class="confirm-content">
      <div class="confirm-icon sucesso">
        <i class="fas fa-check-circle"></i>
      </div>
      <h2>Conta confirmada!</h2>
      <p>{{ mensagem }}</p>
      <p class="redirect-msg">Redirecionando para o login em instantes...</p>
      <button class="btn-confirmar" (click)="irParaLogin()">
        <i class="fas fa-sign-in-alt"></i> Ir para o Login
      </button>
    </div>

    <!-- Link expirado -->
    <div *ngIf="estado === 'expirado'" class="confirm-content">
      <div class="confirm-icon expirado">
        <i class="fas fa-clock"></i>
      </div>
      <h2>Link expirado</h2>
      <p>{{ mensagem }}</p>

      <div *ngIf="!reenviado">
        <button class="btn-confirmar" (click)="reenviarLink()" [disabled]="reenviando" style="margin-right:10px">
          <i class="fas fa-spinner fa-spin" *ngIf="reenviando"></i>
          <i class="fas fa-paper-plane" *ngIf="!reenviando"></i>
          {{ reenviando ? 'Enviando...' : 'Reenviar link' }}
        </button>
        <button class="btn-confirmar outline" (click)="irParaLogin()">
          <i class="fas fa-arrow-left"></i> Voltar ao Login
        </button>
      </div>

      <div *ngIf="reenviado" style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px;margin-top:12px">
        <i class="fas fa-check-circle" style="color:#16a34a"></i>
        Novo link enviado! Verifique seu e-mail.
      </div>
    </div>

    <!-- Erro -->
    <div *ngIf="estado === 'erro'" class="confirm-content">
      <div class="confirm-icon erro">
        <i class="fas fa-times-circle"></i>
      </div>
      <h2>Erro ao confirmar</h2>
      <p>{{ mensagem }}</p>
      <button class="btn-confirmar outline" (click)="irParaLogin()">
        <i class="fas fa-arrow-left"></i> Voltar ao Login
      </button>
    </div>
  </div>
</div>
